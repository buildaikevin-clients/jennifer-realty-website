# Netlify configuration.
# The site is static with no build step, so publish is simply the repo root.

[build]
  publish = "."
  command = ""

# -------------------------------------------------------------- redirects ---
# The About page was folded into the home page band on 2026-07-27. Permanent,
# not temporary: anything already pointing at /about.html should be told the
# content moved rather than being handed a 404.
[[redirects]]
  from = "/about.html"
  to = "/#about"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301
  force = true

# ------------------------------------------------------------ DM keywords ---
# Short links Jennifer pastes into a DM after someone comments a keyword on a
# video. Each 200 rewrites to the real landing page file so the extensionless
# form always works, whether or not Pretty URLs is on. Landing pages are
# noindex and stay out of the sitemap; the guides they gate are public.
# Generated pages live in g/, one per guide, by scripts/build-guides.js.
[[redirects]]
  from = "/g/relocate"
  to = "/g/relocate.html"
  status = 200

[[redirects]]
  from = "/g/invest"
  to = "/g/invest.html"
  status = 200

[[redirects]]
  from = "/g/buyer"
  to = "/g/buyer.html"
  status = 200

[[redirects]]
  from = "/g/sell"
  to = "/g/sell.html"
  status = 200

# ----------------------------------------------------------- private paths ---
# publish = "." ships the whole repository, so every internal file is reachable
# at its own URL unless it is blocked here. These are working files: project
# documentation, the build scripts, the scraper, the brand kit. None of them is
# referenced by any page, confirmed with scripts/check-links.js.
#
# BROKER-PERMISSION.md is the one that matters most. It records how listing
# data is obtained and what was decided about the risk, which is exactly the
# document that should not be served next to the listings it describes.
#
# force = true is load bearing on every rule below. Without it a real file on
# disk wins over the redirect and the document is served anyway.
#
# The target does not exist. Netlify returns its own 404 body with the correct
# status, which is fine. A site 404.html would be better and is worth adding,
# but per COMPLIANCE.md every page carries the Equal Housing Opportunity
# footer, so it is a real page rather than a stub. Left as a follow up.
#
# THIS IS A DENY LIST, SO IT GOES STALE. Anything added to the repo later is
# public by default until someone remembers to add it here. The permanent fix
# is a build step that copies only shippable files into a dist directory and
# pointing publish at that. That trades away the no build step property this
# site is deliberately built around, which is why it is not done today.

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/COMPLIANCE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BROKER-PERMISSION.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/README.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/neighborhoods/CREDITS.md"
  to = "/404.html"
  status = 404
  force = true

# The raw scraper output. data/listings.js is the file the page actually loads
# and stays reachable; this is the same data in a form nothing requests.
[[redirects]]
  from = "/data/listings.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# Stamp written by scripts/set-domain.js recording the current host.
[[redirects]]
  from = "/.domain"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Directories, splat at the end. Node build tooling, the scraper source, the
# logo build kit, and the original bio draft.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Internal strategy docs: Google profile setup, review templates, the funnel
# runbook. Client facing working files, never web content.
[[redirects]]
  from = "/seo/*"
  to = "/404.html"
  status = 404
  force = true

# Function SOURCE. The endpoint itself is served at /.netlify/functions/lead,
# but publish = "." also exposes the raw file at /netlify/functions/lead.mjs
# as a static asset unless it is blocked here.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Apps Script source for the lead sheet. Server side code, has no business
# being downloadable.
[[redirects]]
  from = "/apps-script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scraper/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/brand/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------- headers ---
# Security headers first. None of these need a build step and all of them are
# things a real estate site should have had from day one.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy. Google Fonts is the only external origin.
    # 'unsafe-inline' on style-src is required because JSON-LD aside, the hero
    # and reveal system write inline custom properties (--d, --scrub-exit).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Fingerprint-free assets change rarely but do change, so they get a short
# revalidating cache rather than immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Hero frames are generated and never edited in place. Safe to cache hard.
[[headers]]
  for = "/assets/hero-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Listing data is rewritten by the scraper. Never cache it.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
